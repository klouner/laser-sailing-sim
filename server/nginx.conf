# Альтернатива Caddy: nginx + certbot. Сертификат: sudo certbot --nginx -d laser-top.example.com
server {
    listen 80;
    server_name laser-top.example.com;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
}
